name: MoonTraceGuard CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - name: Format check
        run: moon fmt --check
      - name: Run tests
        run: moon test
      - name: Run CLI smoke tests
        run: |
          moon run cmd/main -- summary
          moon run cmd/main -- flows
          moon run cmd/main -- dns
          moon run cmd/main -- audit
          moon run cmd/main -- gate
          moon run cmd/main -- policy
          moon run cmd/main -- filter
          moon run cmd/main -- export json
          moon run cmd/main -- export csv
          moon run cmd/main -- export audit
      - name: Gate must fail under a strict policy
        run: |
          if moon run cmd/main -- gate '{"max_risk_score": 0}' > /tmp/gate.out 2>&1; then
            echo "gate unexpectedly passed for a strict policy"
            cat /tmp/gate.out
            exit 1
          fi
          cat /tmp/gate.out
